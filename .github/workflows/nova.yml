# Compilación de Nova con el arreglo de SMB2 directo (fork de Carlos-Juann).
# Genera un APK que se instala junto al Nova original (id org.courville.nova.smbfix).
# El resultado (APK arm64/armv7 + log + estado) se publica en la rama `ci-logs` de este mismo repositorio.
name: NOVA SMB fix CI
on:
  push:
    branches: [ nova ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANDROID_NDK_HOME:   ${ANDROID_NDK_LATEST_HOME}
      ANDROID_NDK_ROOT:   ${ANDROID_NDK_LATEST_HOME}
    steps:
    - uses: actions/checkout@v4

    - name: setup java17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: install packages
      run: |
        sudo apt-get update || sudo apt-get update
        sudo apt-get install -y nasm meson ninja-build maven build-essential wget curl unzip git pkg-config

    - name: install repo
      run: |
        curl https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
        sudo chmod a+x /usr/local/bin/repo
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"

    - name: retrieve full nova source
      id: sync
      shell: bash
      run: |
        mkdir nova
        cd nova
        repo init -u "https://github.com/${GITHUB_REPOSITORY_OWNER}/aos-AVP" -b nova -m v6_4_smbfix.xml
        repo sync -j 4
        repo forall -c 'git checkout -t $REPO_REMOTE/$REPO_RREV'
        echo "--- FileCoreLibrary (debe contener el arreglo SMB) ---"
        git -C FileCoreLibrary log --oneline -2
        grep -q "smbConnectConfigs" FileCoreLibrary/src/com/archos/filecorelibrary/smbj/SmbjUtils.java && echo "arreglo SMB presente"

    - name: apply smbfix patches
      id: patch
      shell: bash
      run: bash script/smbfix-patches.sh "$GITHUB_WORKSPACE/nova" "$GITHUB_WORKSPACE/smbfix/smbfix.keystore"

    - name: build
      id: build
      continue-on-error: true
      shell: bash
      run: |
        cd nova/Video
        ./gradlew aNR 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

    - name: publish result to ci-logs branch
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SYNC_OUTCOME: ${{ steps.sync.outcome }}
        PATCH_OUTCOME: ${{ steps.patch.outcome }}
        BUILD_OUTCOME: ${{ steps.build.outcome }}
      run: |
        OUT="$GITHUB_WORKSPACE/ci-out"
        rm -rf "$OUT"; mkdir -p "$OUT"
        [ -f build.log ] && tail -c 5000000 build.log > "$OUT/build.log" || true
        {
          echo "commit: $GITHUB_SHA"
          echo "sync: $SYNC_OUTCOME"
          echo "patch: $PATCH_OUTCOME"
          echo "build: $BUILD_OUTCOME"
          echo "--- apks ---"
          find nova/Video/build/outputs/apk -name '*.apk' -exec ls -l {} \; 2>/dev/null || true
        } > "$OUT/STATUS.txt"
        APK=$(find nova/Video/build/outputs/apk -name '*arm64-v8a*.apk' 2>/dev/null | head -n 1)
        if [ -n "$APK" ]; then
          size=$(stat -c %s "$APK")
          if [ "$size" -lt 99000000 ]; then cp "$APK" "$OUT/nova-smbfix-arm64-v8a.apk"; else echo "omitido por tamaño (>99MB): $APK" >> "$OUT/STATUS.txt"; fi
        fi
        cd "$OUT"
        git init -q -b ci-logs
        git add -A
        git commit -q -m "CI ${GITHUB_SHA}"
        git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

    - name: fail if build failed
      if: steps.build.outcome == 'failure'
      run: exit 1
